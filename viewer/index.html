<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Band 9 Location</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="">
<style>
  :root { --bg:#14130d; --card:#1c1a11; --line:#2a2617; --text:#faf3e7; --muted:#9a9382; --mint:#6ee7b7; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #map { position:absolute; inset:0; background:var(--bg); }
  .panel { position:absolute; left:16px; bottom:16px; z-index:1000; max-width:min(360px, calc(100vw - 32px));
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  h1 { margin:0 0 4px; font-size:19px; }
  .meta { color:var(--muted); font-size:14px; line-height:1.5; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button, label.file { font:inherit; font-size:14px; border:0; border-radius:10px; padding:8px 14px; cursor:pointer; }
  .primary { background:var(--mint); color:#06120c; font-weight:600; }
  .ghost { background:transparent; color:var(--text); border:1px solid var(--line); text-decoration:none; }
  .drop { position:absolute; inset:0; z-index:1100; display:none; align-items:center; justify-content:center;
    background:rgba(20,19,13,.85); color:var(--mint); font-size:20px; pointer-events:none; }
  .drop.active { display:flex; }
  input[type=file] { display:none; }
  .err { color:#ff7a7a; }
</style>
</head>
<body>
<div id="map"></div>
<div class="drop" id="drop">Drop your last-location.json here</div>
<div class="panel">
  <h1>Band 9</h1>
  <div class="meta" id="info">Pick a location report. The Mac client writes it as <code>last-location.json</code>.</div>
  <div class="row">
    <label class="file primary">Choose report<input type="file" id="file" accept="application/json,.json"></label>
    <a class="ghost" id="maps" style="display:none" target="_blank" rel="noopener">Open in Maps</a>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
  integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin=""></script>
<script>
const map = L.map('map', { zoomControl:true }).setView([39, 35], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'© OpenStreetMap'
}).addTo(map);
let marker, circle;

function minutesAgo(date) {
  const m = Math.round((Date.now() - date.getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  return h < 24 ? h + ' h ago' : Math.floor(h / 24) + ' d ago';
}

function parseReport(text) {
  const d = JSON.parse(text);
  const lat = +d.latitude, lon = +d.longitude, acc = +d.horizontal_accuracy;
  const date = new Date(d.timestamp);
  if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180
    || !Number.isFinite(acc) || acc < 0 || isNaN(date.getTime())) {
    throw new Error('Not a valid location report.');
  }
  return { lat, lon, acc, date };
}

function show(r) {
  if (marker) marker.remove();
  if (circle) circle.remove();
  marker = L.circleMarker([r.lat, r.lon], { radius:9, color:'#06120c', weight:2, fillColor:'#6ee7b7', fillOpacity:1 }).addTo(map);
  circle = L.circle([r.lat, r.lon], { radius:r.acc, color:'#6ee7b7', weight:1, fillColor:'#6ee7b7', fillOpacity:.1 }).addTo(map);
  map.setView([r.lat, r.lon], Math.max(13, 19 - Math.log2(Math.max(r.acc, 20) / 20)));
  document.getElementById('info').innerHTML =
    `Last report: <b>${r.date.toLocaleString()}</b> (${minutesAgo(r.date)})<br>Accuracy: ~${Math.round(r.acc)} m`
    + `<br><span class="meta">This is where the report was collected, not live GPS.</span>`;
  const maps = document.getElementById('maps');
  maps.href = `https://www.google.com/maps?q=${r.lat},${r.lon}`;
  maps.style.display = '';
  try { localStorage.setItem('band9-last', JSON.stringify(r)); } catch (e) {}
}

function load(text) {
  try { show(parseReport(text)); }
  catch (e) { document.getElementById('info').innerHTML = '<span class="err">' + e.message + '</span>'; }
}

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) f.text().then(load);
});
const drop = document.getElementById('drop');
['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('active'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); if (t === 'drop' || e.target === drop) drop.classList.remove('active'); }));
document.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(load);
});
try {
  const saved = localStorage.getItem('band9-last');
  if (saved) { const r = JSON.parse(saved); r.date = new Date(r.date); show(r); }
} catch (e) {}
</script>
</body>
</html>
